<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rooster Grin Vue Boilerplate</title>

    <!-- General META -->
    <meta charset='utf-8'>
    <meta http-equiv='Cache-control' content='public'>

    <!-- SEO META -->
    <meta name='description'>
    <meta name='keywords'>

    <!-- Responsive META -->
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <!-- Google Tag Manager -->
    <!-- SET YOUR GOOGLE FONT IN THE ENQUEUE.PHP FILE FOR BEST SPEED -->
    
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  </head>
  <body>
    <div id='app'></div>
    <!-- built files will be auto injected -->
    <script type="text/javascript">
      WebFontConfig = {
        google: { families: [ 'Open+Sans:100,700' ] }
      };
      (function() {
        var wf = document.createElement('script');
        wf.src = ('https:' == document.location.protocol ? 'https' : 'http') +
          '://ajax.googleapis.com/ajax/libs/webfont/1/webfont.js';
        wf.type = 'text/javascript';
        wf.async = 'true';
        var s = document.getElementsByTagName('script')[0];
        s.parentNode.insertBefore(wf, s);
      })();

      function subMenu(val) { 
        var x = document.getElementById("subMenu-"+val); 
         if (x.classList.contains("navigation__body-animation--active")) {
           x.classList.remove("navigation__body-animation--active");
        } else {
          x.nextElementSibling.classList.remove("navigation__body-animation--active");
          x.previousElementSibling.classList.remove("navigation__body-animation--active");
          x.classList.add("navigation__body-animation--active");
        }
        
        return false;
      }
    </script>
  </body>
</html>
